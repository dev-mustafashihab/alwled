# PHASE 3 — STEP 2: قطعة nginx لخدمة صور السلايدر (جاهزة — لم تُطبَّق بعد)
#
# تُضاف داخل server block الخاص بـ panel.fahd-car.cloud
# (نفس الملف: /etc/nginx/sites-enabled/panel) — ثم: nginx -t && systemctl reload nginx
#
# المواصفات المطبَّقة هنا:
#   • عرض الصور فقط (static assets)      • منع directory listing (autoindex off)
#   • منع تنفيذ أي سكربت                 • كاش طويل آمن لأن الأسماء فريدة (uuid)
#   • لا تُخدم أي مسارات أخرى من uploads

location /uploads/slider/ {
    alias /root/alwled/uploads/slider/;

    autoindex off;
    disable_symlinks on;

    # الصور فقط — أي امتداد آخر يُرفض
    location ~* ^/uploads/slider/.+\.(?:webp|png|jpe?g)$ {
        alias /root/alwled/uploads/slider/;
        autoindex off;
        disable_symlinks on;

        types { image/webp webp; image/png png; image/jpeg jpg jpeg; }
        default_type image/webp;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex" always;

        # لا تنفيذ لأي شيء
        location ~* \.(?:php|py|sh|pl|cgi|js|html?)$ { deny all; }
    }

    # أي شيء آخر تحت هذا المسار: ممنوع
    location ~* \.(?:php|py|sh|pl|cgi)$ { deny all; }
}

# ملاحظة: مجلد uploads/slider نفسه خارج أي مسار قابل للتنفيذ،
# ولا يُخدم منه شيء غير الصور. لا يكشف أي مسار فيزيائي للعميل (الرابط العام فقط).

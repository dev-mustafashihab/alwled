server {
    server_name panel.fahd-car.cloud;

    # Return caller's public IP - plain text, no caching
    location = /myip {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "$remote_addr\n";
    }

    # ==== Marketplace API (Phase 2 demo) ====
    location /mp-api/ {
        proxy_pass http://127.0.0.1:5400/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    location /mp-media/ {
        alias /opt/shihab-marketplace/uploads/media/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
    }

    # ==== Marketplace Admin (Phase 8) ====
    location /mp-admin/ {
        alias /opt/shihab-marketplace/admin/;
        index index.html;
        add_header Cache-Control "no-store";
    }
    location = /mp-admin {
        return 301 /mp-admin/;
    }

    # ==== Marketplace Vendor (Phase 9) ====
    location /mp-vendor/ {
        alias /opt/shihab-marketplace/admin/vendor/;
        index index.html;
        add_header Cache-Control "no-store";
    }
    location = /mp-vendor {
        return 301 /mp-vendor/;
    }
    location = /mp-vendor/ {
        rewrite ^ /mp-vendor/index.html last;
    }
    location = /mp-admin/ {
        rewrite ^ /mp-admin/index.html last;
    }

    # ---------------- alwled admin panel (static) + API ----------------
    # المسار الرئيسي = صفحة الزبون (متجر عرض المنتجات)
    location = /alwled { return 301 /alwled/shop/; }
    location = /alwled/ { return 301 /alwled/shop/; }

    # لوحة الإدارة على مسار إداري صريح (نفس التطبيق، نفس الـassets النسبية، نفس الـAPI)
    location = /alwled/admin { return 301 /alwled/admin/; }
    location /alwled/admin/ {
        proxy_pass http://127.0.0.1:5173/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    # المسار الفرعي للمتجر: للطلب بلا شرطة أخيرة redirect داخل نفس البادئة
    # (بدون هذا السطر كان الرد 301 إلى /shop/ بلا /alwled/ فيبدو المتجر غير قابل للوصول)
    location = /alwled/shop { return 301 /alwled/shop/; }

    location /alwled/ {
        proxy_pass http://127.0.0.1:5173/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /alwled-api/ {
        proxy_pass http://127.0.0.1:3100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 1m;
    }

    location / {
        limit_req zone=general burst=20 nodelay;
        limit_conn conn_limit 30;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /wagw/ {
        proxy_pass http://127.0.0.1:8790/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /wa/ {
        limit_req zone=general burst=20 nodelay;
        limit_conn conn_limit 30;
        proxy_pass http://127.0.0.1:8791/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }


    location /ws {
        proxy_pass http://127.0.0.1:8088/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /awtar/img-shop/ {
        proxy_pass http://127.0.0.1:5101/api/img/;
    }
    location /awtar/admin/img/ {
        proxy_pass http://127.0.0.1:5101/api/img/;
    }
    location /awtar/admin/ {
        proxy_pass http://127.0.0.1:5101/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /awtar/api/ {
        proxy_pass http://127.0.0.1:5101/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /awtar/ {
        alias /var/www/awtar/;
        index index.html;
        add_header Cache-Control "no-cache";
        charset utf-8;
    }

    location /company/ {
        proxy_pass http://127.0.0.1:8700/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /saas/ {
        limit_req zone=general burst=20 nodelay;
        limit_conn conn_limit 30;
        proxy_pass http://127.0.0.1:5002/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /mustafa/ {
        alias /var/www/app-mustafa/;
        index adminer.php index.php index.html;
        client_max_body_size 100M;
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }
    }

    location /editor/ {
        alias /var/www/editor/;
        index index.html;
        try_files $uri $uri/ /editor/index.html;
    }


    location /7b5d7a47 {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /dovid/ {
        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /mod/ {
        alias /var/www/mod-syria/;
        index index.html;
        try_files $uri $uri/ /mod/index.html;
    }

    
    # MORTAL BROS game (static)
    location /game/ {
        alias /var/www/mortal-bros/;
        index index.html;
        add_header Cache-Control "no-cache";
    }
    # MORTAL MARIO KOMBAT v2 (static, React+Vite)
    location /mortal/ {
        alias /var/www/mortal-mario/;
        index index.html;
        try_files $uri $uri/ /mortal/index.html;
        add_header Cache-Control "no-cache";
    }
    location /dl/ {
        alias /var/www/html/dl/;
        autoindex off;
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "no-cache";
    }

    location /defense/uploads/ {
        deny all;
        return 404;
    }

    # Static assets served directly by nginx — bypasses Gunicorn (perf fix 2026-08-15)
    # Verdict-only subrequest: Flask validates the signed session cookie (no DB hit)
    location = /_defense_auth {
        internal;
        proxy_pass http://127.0.0.1:5100/internal/auth-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location ~* ^/defense/static/(css|js|fonts|patterns)/.+\.(css|js|woff2?|ttf|svg|png|jpg|jpeg|webp)$ {
        auth_request /_defense_auth;
        rewrite ^/defense/static/(.*)$ /$1 break;
        root /var/www/defense-app/static;
        # no-cache + etag: browser revalidates (304 = 0 bytes) so JS updates apply instantly
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        etag on;
    }

    # fonts are not sensitive — login page needs them before auth (401 breaks Qomra rendering)
    location ^~ /defense/static/patterns/ {
        rewrite ^/defense/static/(.*)$ /$1 break;
        root /var/www/defense-app/static;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /defense/static/fonts/ {
        rewrite ^/defense/static/(.*)$ /$1 break;
        root /var/www/defense-app/static;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /defense/static/emblem.svg {
        alias /var/www/defense-app/static/emblem.svg;
        expires 7d;
    }


        location ^~ /forcesub/hook/ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/forcesub/hook.php;
        fastcgi_read_timeout 30s;
    }

    location /defense/ {
        proxy_pass http://127.0.0.1:5100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }


    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    # ==== Marketplace Dashboard (Admin v2) ====
    location /mp-dashboard/ {
        alias /opt/shihab-marketplace/dashboard/;
        index index.html;
        add_header Cache-Control "no-store";
    }
    location = /mp-dashboard {
        return 301 /mp-dashboard/;
    }
    location = /mp-dashboard/ {
        rewrite ^ /mp-dashboard/index.html last;
    }
    location /abohzyfa/ {
        alias /opt/abohzyfa/;
        index index.html;
        add_header Cache-Control "no-store";
    }
    location = /abohzyfa {
        return 301 /abohzyfa/;
    }

    ssl_certificate /etc/letsencrypt/live/panel.fahd-car.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/panel.fahd-car.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = panel.fahd-car.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    listen 80;
    listen [::]:80;
    server_name panel.fahd-car.cloud;
    return 404; # managed by Certbot
}

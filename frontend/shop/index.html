<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الوليد للأجهزة الكهربائية — متجر</title>

  <meta name="robots" content="index, follow">
  <link rel="canonical" href="/alwled/shop/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="الوليد للأجهزة الكهربائية">
  <meta property="og:title" content="الوليد للأجهزة الكهربائية — متجر">
  <meta property="og:description" content="تصفّح منتجات المنزل الكهربائية بأسعار المتجر الحقيقية، والدفع عبر شام كاش مع مراجعة يدوية.">
  <meta property="og:locale" content="ar_SY">
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" type="image/png" href="../assets/icons/logo-alwaleed.png">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="assets/css/shop.css">
<!-- Stage 15.2: هيدر + قائمة الجوال (مكوّن مستقل) -->
<link rel="stylesheet" href="assets/css/shop.header.css">
<link rel="stylesheet" href="assets/css/shop.search.css">
<link rel="stylesheet" href="assets/css/shop.filters.css">
<link rel="stylesheet" href="assets/css/shop.home.css">
<!-- PHASE 1 — طبقة Tailwind v4 الجديدة (مُولَّدة: tailwind/input.css ⇒ shop.tw.css).
     لا preflight + كل القواعد في @layer أو داخل نطاق .stw ⇒ لا تتغلّب على الواجهة الحالية. -->
<link rel="stylesheet" href="assets/css/shop.tw.css">
<!-- POLISH LAYER — تحسين إحساس فقط (انتقالات/ظلال/فوكس/تحديد) · صفر تغيير عرض -->
<link rel="stylesheet" href="assets/css/shop.polish.css">
<!-- FOOTER MARK — فوتر الشعار المتحرك 3D -->
<link rel="stylesheet" href="assets/css/shop.footer-mark.css">
<!-- HEADER ACTIONS — توازن وتصغير أزرار الزائر -->
<link rel="stylesheet" href="assets/css/shop.header-actions.css">
<!-- بطاقات صفحة المنتجات بنفس شكل بطاقات الرئيسية -->
<link rel="stylesheet" href="assets/css/shop.products-cards.css">
<!-- تحسينات تجربة الرئيسية: تبديل العرض + زر نهاية القسم -->
<link rel="stylesheet" href="assets/css/shop.home-ux.css">
<script defer src="assets/js/shop.reveal.js"></script>
</head>
<body class="shop-body">
  <a class="skip-link" href="#shop-main">تخطي إلى المحتوى</a>

  <header class="shop-header" id="shop-header">
    <div class="shop-header__inner">
      <a class="shop-brand" href="#/" aria-label="الوليد للأجهزة الكهربائية — الصفحة الرئيسية">
        <img class="shop-brand__logo" src="../assets/icons/logo-alwaleed.png" alt="" width="44" height="36" loading="eager">
        <span class="shop-brand__text">
          <strong>الوليد</strong>
          <small>للأجهزة الكهربائية</small>
        </span>
      </a>

      <span class="shop-header__divider" aria-hidden="true"></span>
      <nav class="shop-nav" id="shop-nav" aria-label="التنقل الرئيسي">
        <a class="shop-nav__link" data-nav="home" href="#/">الرئيسية</a>
        <a class="shop-nav__link" data-nav="products" href="#/products">المنتجات</a>
        <a class="shop-nav__link" data-nav="categories" href="#/products?view=categories">التصنيفات</a>
        <a class="shop-nav__link" data-nav="brands" href="#/products?view=brands">العلامات</a>
      </nav>

      <span class="shop-header__spacer" aria-hidden="true"></span>

      <form class="shop-search" id="shop-search-form" role="search" autocomplete="off">
        <label class="visually-hidden" for="shop-search-input">ابحث في المنتجات</label>
        <input class="input shop-search__input" id="shop-search-input" name="q" type="search"
               placeholder="ابحث عن منتج…" aria-label="ابحث في المنتجات">
        <button class="btn btn--primary btn--sm shop-search__btn" type="submit">بحث</button>
      </form>

      <button type="button" class="shop-iconbtn shop-searchbtn" id="shop-search-btn"
              aria-label="البحث في المنتجات" aria-haspopup="dialog" aria-controls="shop-search-sheet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-search"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
      </button>

      <div class="shop-actions" id="shop-actions">
        <!-- visitor / authenticated actions are rendered here by shop.js -->
      </div>

      <button type="button" class="shop-iconbtn shop-header__burger" id="shop-burger"
              aria-label="فتح القائمة" aria-controls="shop-drawer" aria-expanded="false">
        <span class="shop-burger"><span></span><span></span><span></span></span>
      </button>
    </div>
    <nav class="shop-quicknav" id="shop-quicknav" aria-label="تنقّل سريع">
      <a class="shop-quicknav__link" data-nav="home" href="#/">الرئيسية</a>
      <a class="shop-quicknav__link" data-nav="products" href="#/products">المنتجات</a>
      <a class="shop-quicknav__link" data-nav="categories" href="#/products?view=categories">التصنيفات</a>
      <a class="shop-quicknav__link" data-nav="brands" href="#/products?view=brands">العلامات</a>
    </nav>
  </header>

  <div class="shop-search-sheet" id="shop-search-sheet" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="البحث في المنتجات">
    <div class="shop-search-sheet__head">
      <label class="visually-hidden" for="shop-search-sheet-input">ابحث في المنتجات</label>
      <div class="shop-search-sheet__field">
        <span class="shop-search-sheet__field-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-search"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></span>
        <input class="input shop-search-sheet__input" id="shop-search-sheet-input" type="search"
               placeholder="ابحث عن منتج…" autocomplete="off" enterkeyhint="search" aria-label="ابحث في المنتجات">
        <button type="button" class="shop-search-sheet__clear" id="shop-search-clear" hidden aria-label="مسح نص البحث">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <button type="button" class="shop-search-sheet__close" id="shop-search-close" aria-label="إغلاق البحث">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="shop-search-sheet__body" id="shop-search-body">
      <div class="shop-search-sheet__section" id="shop-search-suggest">
        <p class="shop-search-sheet__label">اقتراحات من المتجر</p>
        <div id="shop-search-suggest-list"></div>
      </div>
      <div class="shop-search-results" id="shop-search-results"></div>
    </div>
  </div>

  <div class="shop-drawer" id="shop-drawer" hidden aria-hidden="true">
    <div class="shop-drawer__panel" role="dialog" aria-modal="true" aria-label="قائمة التنقل">
      
      <div class="shop-menu__scroll" id="shop-menu-scroll">
      <!-- 1) معلومات المستخدم المختصرة (للمسجّل) -->
      <div class="shop-menu__user" id="shop-menu-user" hidden></div>

      <!-- 2) روابط التسوق -->
      <p class="shop-menu__label">تسوّق</p>
      <nav class="shop-drawer__nav" aria-label="قائمة الجوال">
        <a class="shop-drawer__link" href="#/"><span class="shop-drawer__link__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-house"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span>الرئيسية</span></a>
        <a class="shop-drawer__link" href="#/products"><span class="shop-drawer__link__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-layout-grid"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg></span><span>كل المنتجات</span></a>
        <a class="shop-drawer__link" href="#/products?view=categories"><span class="shop-drawer__link__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-folder"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg></span><span>التصنيفات</span></a>
        <a class="shop-drawer__link" href="#/products?view=brands"><span class="shop-drawer__link__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-tag"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg></span><span>العلامات</span></a>
        <a class="shop-drawer__link" href="#/cart"><span class="shop-drawer__link__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-shopping-cart"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg></span><span>السلة</span></a>
      </nav>

      <!-- 3) الزائر: تسجيل الدخول / إنشاء حساب -->
      <div class="shop-menu__guest" id="shop-menu-guest">
        <span class="shop-menu__divider" aria-hidden="true"></span>
        <p class="shop-menu__label">حسابك</p>
        <a class="shop-drawer__link" href="#/login"><span class="shop-drawer__link__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-log-in"><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></svg></span><span>تسجيل الدخول</span></a>
        <a class="shop-drawer__link" href="#/register"><span class="shop-drawer__link__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-user-plus"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg></span><span>إنشاء حساب</span></a>
      </div>

      <!-- 4) المسجّل: الحساب · الطلبات · الإشعارات · التوثيق · الخروج (تُبنى من JS) -->
      <div class="shop-menu__account" id="shop-menu-account" hidden>
        <span class="shop-menu__divider" aria-hidden="true"></span>
        <p class="shop-menu__label">حسابي</p>
      </div>

      </div><!-- /shop-menu__scroll -->

      <!-- 5) المظهر — مثبّت أسفل القائمة وحركته منزلقة -->
      <span class="shop-menu__divider" aria-hidden="true"></span>
      <div class="shop-menu__theme" role="group" aria-label="مظهر الواجهة">
        <span class="shop-menu__theme-thumb" aria-hidden="true"></span>
        <button type="button" class="shop-menu__theme-btn" data-theme-mode="light" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          <span>فاتح</span>
        </button>
        <button type="button" class="shop-menu__theme-btn" data-theme-mode="dark" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-moon"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
          <span>داكن</span>
        </button>
        <button type="button" class="shop-menu__theme-btn" data-theme-mode="system" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-monitor"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
          <span>النظام</span>
        </button>
      </div>

      <!-- 6) ملاحظة/CTA للزائر (تُبنى من JS) -->
      <div class="shop-drawer__foot" id="shop-drawer-account"></div>
    </div>
    <div class="shop-drawer__scrim" data-drawer-close></div>
  </div>

  <main class="shop-main" id="shop-main" tabindex="-1">
    <!-- STEP 3G: أُزيل aria-live العام (كان يعلن الصفحة كاملة) — الإعلانات الآن مقيّدة:
         عدّاد النتائج (role=status) · رسالة التحميل · حالات الفراغ/الخطأ · التوستات -->
    <div class="shop-container" id="shop-view"></div>
  </main>

  <footer class="shop-footer shop-footer--mark">
    <img class="shop-footer__logo3d" src="../assets/icons/logo-alwaleed-mark.png"
         alt="شعار الوليد للأجهزة الكهربائية" width="359" height="352" loading="lazy">
    <strong class="shop-footer__name">الوليد للأجهزة الكهربائية</strong>
    <span class="shop-footer__year">© <span id="shop-year">2026</span> — جميع الحقوق محفوظة</span>
  </footer>

  <div class="toast-stack" id="shop-toasts" aria-live="polite" aria-atomic="false"></div>

  <script src="../assets/js/core/config.js" defer></script>
  <script src="../assets/js/core/session.js" defer></script>
  <script src="../assets/js/core/format.js" defer></script>
  <script src="../assets/js/core/api.js" defer></script>
  <script src="assets/js/shop.js" defer></script>
  <script src="assets/js/shop.order-flow.js" defer></script>
  <script src="assets/js/shop.cart.js" defer></script>
  <script src="assets/js/shop.pages.js" defer></script>
  <script src="assets/js/shop.cart-ui.js" defer></script>
  <script src="assets/js/shop.cart-page.js" defer></script>
  <script src="assets/js/shop.checkout-page.js" defer></script>
  <script src="assets/js/shop.orders-page.js" defer></script>
  <script src="assets/js/shop.order-page.js" defer></script>
  <script src="assets/js/shop.payment-page.js" defer></script>
  <script src="assets/js/shop.notifications-page.js" defer></script>
  <script src="assets/js/shop.account-page.js" defer></script>
  <script src="assets/js/shop.verification-page.js" defer></script>
  <script src="assets/js/shop.icons.js" defer></script>
  <script src="assets/js/shop.search.js" defer></script>
  <script src="assets/js/shop.header.js" defer></script>
  <script src="assets/js/shop.app.js" defer></script>
</body>
</html>

# Alwled — production-leaning compose (لا يحتوي أي سرّ؛ القيم تأتي من environment أو ملف .env غير المُتتبَّع)
#
# تشغيل:  cp .env.example .env  ← املأ القيم الحقيقية محلياً، ثم
#         docker compose up -d --build
#
# ملاحظة معمارية: الواجهة (frontend/) ملفات ثابتة تُقدَّم من reverse proxy (nginx) — لا تُبنى ولا تُشحن داخل هذه الحاوية.
services:
  db:
    image: postgres:16-alpine
    container_name: alwled-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alwled}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD مطلوب من البيئة}
      POSTGRES_DB: ${POSTGRES_DB:-alwled}
    volumes:
      - alwled_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alwled} -d ${POSTGRES_DB:-alwled}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alwled-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3100}
      # الـURL يُبنى من متغيّرات البيئة — لا تُكتب كلمة مرور في هذا الملف
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL مطلوب من البيئة}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET مطلوب من البيئة}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET مطلوب من البيئة}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      VERIFICATION_PROVIDER: ${VERIFICATION_PROVIDER:-LOG}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-IN_APP}
      SHAMCASH_WALLET_NUMBER: ${SHAMCASH_WALLET_NUMBER:-}
      SHAMCASH_ACCOUNT_NAME: ${SHAMCASH_ACCOUNT_NAME:-}
      SHAMCASH_INSTRUCTIONS: ${SHAMCASH_INSTRUCTIONS:-}
      SHAMCASH_CURRENCY: ${SHAMCASH_CURRENCY:-USD}
    # الاستماع على loopback فقط: TLS وreverse proxy على المضيف
    ports:
      - "127.0.0.1:${PORT:-3100}:${PORT:-3100}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3100)+'/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  alwled_pgdata:
